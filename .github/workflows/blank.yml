
name: Run Postman Collection with env properties

on:
  workflow_dispatch:
    inputs:
      environment:
         description: 'Witch environment'
         required: true
         type: environment
   

jobs:
  run-postman-collection:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      # Шаг 0: Перевірка репозиторію
      - name: Checkout environment
        run: echo "${{github.event.inputs.environment}}"
      
      # Шаг 1: Checkout кода репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # Шаг 2: Установить Node.js (поскольку newman — это Node.js пакет)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # или другая версия, которая вам нужна

      # Шаг 3: Установить Newman для выполнения Postman коллекции
      - name: Install Newman
        run: npm install -g newman

      # Шаг 4: Установить HTML reporter
      - name: Install html-extra
        run: npm install -g newman-reporter-htmlextra

      # Шаг 5: Ствоереня директорії для репорту
      - name: Make directory for result
        run: mkdir -p testResult

      # Шаг 5: Запуск Postman коллекции
      - name: Run Postman Collection
        run: newman run https://api.postman.com/collections/6997315-fad41e3d-aaff-4b78-9010-c970f331544d?apikey=${{ secrets.POSTMAN_API_KEY }} -e ${{ vars.URL }}?apikey=${{ secrets.POSTMAN_API_KEY }} -r cli,htmlextra --reporter-htmlextra-export testResult/htmlreport.html

      # Шаг 5: Сохранить отчет о выполнении
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: Report result
          path: testResult
